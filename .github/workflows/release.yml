name: Release

on:
    push:
        branches:
            - main

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 2

            - name: Read package metadata
              id: package
              run: |
                  echo "name=$(jq -r '.name' package.json)" >> "$GITHUB_OUTPUT"
                  echo "version=$(jq -r '.version' package.json)" >> "$GITHUB_OUTPUT"

            - name: Check version change
              id: version
              run: |
                  OLD_VERSION=$(git show HEAD^:package.json | jq -r '.version')
                  NEW_VERSION=$(jq -r '.version' package.json)

                  if [ "$OLD_VERSION" != "$NEW_VERSION" ]; then
                    echo "changed=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "changed=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Create tag
              if: steps.version.outputs.changed == 'true'
              run: |
                  TAG="${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }}"
                  git tag "$TAG"
                  git push origin "$TAG"

            - name: Create GitHub Release
              if: steps.version.outputs.changed == 'true'
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }}
                  generate_release_notes: true
